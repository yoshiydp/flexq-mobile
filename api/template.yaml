AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FlexQ Template API

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Default: "lyrics-jwt-secret-change-in-production"
    Description: Secret key for signing JWT tokens
  SenderEmail:
    Type: String
    Default: ""
    Description: Verified SES sender email address
  ReplicateApiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Replicate API token for AI record cleanup (empty disables the feature)
  GoogleClientIds:
    Type: String
    Default: "134608896734-hb1nj0rmlgva07vf6ejlmb1lb6mhr1pi.apps.googleusercontent.com,134608896734-8uuqb674f7pmlt25ku3n05v930mr42a4.apps.googleusercontent.com"
    Description: >-
      Comma-separated Google OAuth client IDs (iOS / Android) allowed for
      Google sign-in token verification (empty skips the aud check)
  ReplicateSeparateModel:
    Type: String
    Default: "ryan5453/demucs"
    Description: Replicate model (owner/name) used for vocal separation
  ReplicateDenoiseModel:
    Type: String
    Default: "ryan5453/demucs"
    Description: >-
      Replicate model (owner/name) used for the denoise path. demucs vocal
      isolation substitutes for denoise because resemble-enhance cannot read
      m4a containers (librosa-based loader supports wav/mp3/flac only)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 10
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        PROJECTS_TABLE: !Ref ProjectsTable
        TRACKS_TABLE: !Ref TracksTable
        RECORDS_TABLE: !Ref RecordsTable
        MEMOS_TABLE: !Ref MemosTable
        VERIFICATION_CODES_TABLE: !Ref VerificationCodesTable
        JWT_SECRET: !Ref JwtSecret
        TRACK_AUDIO_BUCKET: !Ref TrackAudioBucket
        SENDER_EMAIL: !Ref SenderEmail
        GOOGLE_CLIENT_IDS: !Ref GoogleClientIds
        REPLICATE_API_TOKEN: !Ref ReplicateApiToken
        REPLICATE_SEPARATE_MODEL: !Ref ReplicateSeparateModel
        REPLICATE_DENOISE_MODEL: !Ref ReplicateDenoiseModel
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

Resources:
  # ─── DynamoDB Tables ───────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: googleSub
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # 連携済み Google アカウント（sub）でのログイン照合用 (TASK-78)
        - IndexName: googleSub-index
          KeySchema:
            - AttributeName: googleSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: projectId
          KeyType: RANGE

  TracksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: trackId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: trackId
          KeyType: RANGE

  RecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: projectId-index
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MemosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: memoId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: memoId
          KeyType: RANGE

  # メール認証コード（6 桁 OTP）。新規登録のメール検証とパスワードリセットの
  # 本人確認で共用する。expiresAt の TTL で期限切れコードは自動削除される (TASK-85)
  VerificationCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: purpose
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: purpose
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ─── S3 Bucket ─────────────────────────────────────────
  TrackAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  # ─── API Gateway ───────────────────────────────────────
  LyricsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1

  # ─── Lambda Functions ──────────────────────────────────
  GetDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-data.handler
      CodeUri: ./
      Events:
        GetData:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-data.ts

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-project.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TracksTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-project.ts

  GetProjectDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-project-detail.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TracksTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProjectDetail:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-project-detail.ts

  PostProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-project.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
      Events:
        PostProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
