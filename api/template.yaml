AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lyrics Template API

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Default: "lyrics-jwt-secret-change-in-production"
    Description: Secret key for signing JWT tokens
  SenderEmail:
    Type: String
    Default: ""
    Description: Verified SES sender email address

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 10
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        PROJECTS_TABLE: !Ref ProjectsTable
        TRACKS_TABLE: !Ref TracksTable
        RECORDS_TABLE: !Ref RecordsTable
        MEMOS_TABLE: !Ref MemosTable
        JWT_SECRET: !Ref JwtSecret
        TRACK_AUDIO_BUCKET: !Ref TrackAudioBucket
        SENDER_EMAIL: !Ref SenderEmail
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

Resources:
  # ─── DynamoDB Tables ───────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: projectId
          KeyType: RANGE

  TracksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: trackId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: trackId
          KeyType: RANGE

  RecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: recordId
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: recordId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: projectId-index
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MemosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: memoId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: memoId
          KeyType: RANGE

  # ─── S3 Bucket ─────────────────────────────────────────
  TrackAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3000

  # ─── API Gateway ───────────────────────────────────────
  LyricsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1

  # ─── Lambda Functions ──────────────────────────────────
  GetDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-data.handler
      CodeUri: ./
      Events:
        GetData:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-data.ts

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-project.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TracksTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-project.ts

  GetProjectDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-project-detail.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TracksTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProjectDetail:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-project-detail.ts

  PostProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-project.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
      Events:
        PostProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-project.ts

  PutProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-project.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
      Events:
        PutProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-project.ts

  DeleteProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/delete-project.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        DeleteProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/delete-project.ts

  GetProjectRecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-project-records.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProjectRecords:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}/records
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-project-records.ts

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-profile.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/profile
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-profile.ts

  GetMemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-memo.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MemosTable
      Events:
        GetMemo:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/memo
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-memo.ts

  GetTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-track.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TracksTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-track.ts

  GetTrackUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-track-upload-url.handler
      CodeUri: ./
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${TrackAudioBucket}/*'
      Events:
        GetTrackUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track/upload-url
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-track-upload-url.ts

  PostTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-track.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
      Events:
        PostTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-track.ts

  PutTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-track.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
      Events:
        PutTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track/{id}
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-track.ts

  DeleteTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/delete-track.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        DeleteTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/delete-track.ts

  GetRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-record.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-record.ts

  GetRecordUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-record-upload-url.handler
      CodeUri: ./
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${TrackAudioBucket}/*'
      Events:
        GetRecordUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/upload-url
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-record-upload-url.ts

  PostRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-record.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        PostRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-record.ts

  PutRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-record.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
      Events:
        PutRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-record.ts

  DeleteRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/delete-record.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
      Events:
        DeleteRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/delete-record.ts

  PostMemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-memo.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemosTable
      Events:
        PostMemo:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/memo
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-memo.ts

  PutMemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-memo.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemosTable
      Events:
        PutMemo:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/memo/{id}
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-memo.ts

  DeleteMemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/delete-memo.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MemosTable
      Events:
        DeleteMemo:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/memo/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/delete-memo.ts

  PutProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-profile.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${TrackAudioBucket}/*'
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        PutProfile:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/profile
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-profile.ts

  PostAuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-auth-login.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        PostAuthLogin:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/auth/login
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-auth-login.ts

  PostAuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-auth-logout.handler
      CodeUri: ./
      Events:
        PostAuthLogout:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/auth/logout
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-auth-logout.ts

  PostAuthRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-auth-register.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        PostAuthRegister:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/auth/register
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-auth-register.ts

  PostAuthResetPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-auth-reset-password.handler
      CodeUri: ./
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        PostAuthResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/auth/reset-password
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-auth-reset-password.ts

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${LyricsApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
  UsersTableName:
    Description: DynamoDB Users table name
    Value: !Ref UsersTable
  ProjectsTableName:
    Description: DynamoDB Projects table name
    Value: !Ref ProjectsTable
  TracksTableName:
    Description: DynamoDB Tracks table name
    Value: !Ref TracksTable
  RecordsTableName:
    Description: DynamoDB Records table name
    Value: !Ref RecordsTable
  MemosTableName:
    Description: DynamoDB Memos table name
    Value: !Ref MemosTable
  TrackAudioBucketName:
    Description: S3 bucket for track audio files
    Value: !Ref TrackAudioBucket
