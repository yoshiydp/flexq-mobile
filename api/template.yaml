  PutProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-project.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
      Events:
        PutProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-project.ts

  DeleteProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/delete-project.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        DeleteProject:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/delete-project.ts

  GetProjectRecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-project-records.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProjectRecords:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/project/{id}/records
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-project-records.ts

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-profile.handler
      CodeUri: ./
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/profile
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-profile.ts

  GetMemoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-memo.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref MemosTable
      Events:
        GetMemo:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/memo
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-memo.ts

  GetTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-track.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref TracksTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-track.ts

  GetTrackUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-track-upload-url.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${TrackAudioBucket}/*'
      Events:
        GetTrackUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track/upload-url
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-track-upload-url.ts

  PostTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-track.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
      Events:
        PostTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-track.ts

  PutTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-track.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
        # アートワーク差し替え時に旧オブジェクトを削除してよいか判定するため、
        # 同じ artworkKey を参照するプロジェクトを Query する（読み取りのみ）
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        # 旧アートワーク（artworks/）の DeleteObject に必要（DeleteTrackFunction と同様）
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        PutTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track/{id}
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-track.ts

  DeleteTrackFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/delete-track.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TracksTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        DeleteTrack:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/track/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/delete-track.ts

  GetRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-record.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-record.ts

  GetRecordUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-record-upload-url.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${TrackAudioBucket}/*'
      Events:
        GetRecordUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/upload-url
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-record-upload-url.ts

  PostRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-record.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        PostRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-record.ts

  PutRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/put-record.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
      Events:
        PutRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/put-record.ts

  DeleteRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/delete-record.handler
      CodeUri: ./
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        # ミックス済み音源（records/mixed/）の削除用 (TASK-49)
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        DeleteRecord:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}
            Method: delete
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/delete-record.ts

  PostRecordSeparateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-record-separate.handler
      CodeUri: ./
      Timeout: 25
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        PostRecordSeparate:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}/separate
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-record-separate.ts

  GetRecordSeparateStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-record-separate-status.handler
      CodeUri: ./
      Timeout: 25
      # wav（無圧縮）の分離音源をメモリ上でトリム・16-bit 変換するため増量
      # （24-bit stereo 44.1kHz ≈ 15.5MB/分。長尺録音でも収まるサイズ）
      MemorySize: 1024
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetRecordSeparateStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}/separate-status
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-record-separate-status.ts

  # ─── ミックス（声のみ + トラック音源の合成 / TASK-49） ─────────
  # ffmpeg の静的バイナリ（arm64）。layers/ffmpeg/Makefile がビルド時に
  # ダウンロードして /opt/bin/ffmpeg に配置する
  FfmpegLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-ffmpeg"
      Description: Static ffmpeg binary (Linux arm64) for record mixing
      ContentUri: layers/ffmpeg/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  PostRecordMixFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/post-record-mix.handler
      CodeUri: ./
      Timeout: 25
      Environment:
        Variables:
          RECORD_MIX_WORKER_FUNCTION: !Ref RecordMixWorkerFunction
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TracksTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
        - LambdaInvokePolicy:
            FunctionName: !Ref RecordMixWorkerFunction
      Events:
        PostRecordMix:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}/mix
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/post-record-mix.ts

  # ffmpeg でのミックス処理本体。API Gateway のタイムアウト（29 秒）に
  # 縛られないよう post-record-mix から非同期 Invoke されるワーカー。
  # 分離音源（無圧縮 wav）をディスク・メモリに展開するため増量
  RecordMixWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/record-mix-worker.handler
      CodeUri: ./
      Timeout: 300
      MemorySize: 2048
      # /tmp に分離音源（無圧縮 wav）・トラック音源・ミックス出力を同時に置くため、
      # デフォルト（512MB）では大きな wav トラックで不足し得る
      EphemeralStorage:
        Size: 2048
      # 非同期 Invoke の自動リトライを無効化する。リトライを許すと、固着判定
      # （MIX_STUCK_TIMEOUT_MS）で failed 化した後にリトライが走って二重処理に
      # なるため、失敗時はアプリからの再実行に任せる
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Layers:
        - !Ref FfmpegLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3CrudPolicy:
            BucketName: !Ref TrackAudioBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/record-mix-worker.ts

  GetRecordMixStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/get-record-mix-status.handler
      CodeUri: ./
      Timeout: 25
      Policies:
        # BAN（アカウント停止）チェックで Users テーブルの status を参照する (TASK-81)
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RecordsTable
        - S3ReadPolicy:
            BucketName: !Ref TrackAudioBucket
      Events:
        GetRecordMixStatus:
          Type: Api
          Properties:
            RestApiId: !Ref LyricsApi
            Path: /data/record/{id}/mix-status
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: false
        EntryPoints:
          - lambda/get-record-mix-status.ts

