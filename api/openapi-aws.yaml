openapi: 3.0.3
info:
  title: FlexQ API (AWS)
  version: 1.0.0
  description: |
    This API serves mock data for FlexQ application.
    It is designed to be used with AWS API Gateway + Lambda.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://YOUR_AWS_ACCOUNT_ID.execute-api.ap-northeast-1.amazonaws.com/dev
paths:
  /data/memo:
    get:
      summary: Invoke get-memo
      operationId: get_memo
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                MEMO_DATA:
                  $ref: '#/components/examples/MEMO_DATA'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                message: error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:get-memo/invocations
  /data/profile:
    get:
      summary: Invoke get-profile
      operationId: get_profile
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROFILE_DATA:
                  $ref: '#/components/examples/PROFILE_DATA'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                message: error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:get-profile/invocations
  /data/project:
    get:
      summary: Invoke get-project
      operationId: get_project
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_DATA:
                  $ref: '#/components/examples/PROJECT_DATA'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                message: error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:get-project/invocations
  /data/record:
    get:
      summary: Invoke get-record
      operationId: get_record
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                RECORD_DATA:
                  $ref: '#/components/examples/RECORD_DATA'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                message: error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:get-record/invocations
  /data/track:
    get:
      summary: Invoke get-track
      operationId: get_track
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                TRACK_DATA:
                  $ref: '#/components/examples/TRACK_DATA'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                message: error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:get-track/invocations
  /data/project/{id}/records:
    get:
      summary: Invoke get-project-records
      operationId: get_project_records
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_RECORD_LIST_DATA:
                  $ref: '#/components/examples/PROJECT_RECORD_LIST_DATA'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                message: error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:get-project-records/invocations
  /data/auth/login:
    post:
      summary: Invoke post-auth-login
      operationId: post_auth_login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                AUTH_DATA:
                  $ref: '#/components/examples/AUTH_DATA'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                message: error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:post-auth-login/invocations
  /data/auth/register:
    post:
      summary: Invoke post-auth-register
      operationId: post_auth_register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '409':
          description: Email already in use
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:post-auth-register/invocations
  /data/auth/google:
    post:
      summary: Invoke post-auth-google
      operationId: post_auth_google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                mode:
                  type: string
                  enum:
                    - login
                    - register
      responses:
        '200':
          description: OK (existing user signed in)
        '201':
          description: Created (new user registered and signed in)
        '400':
          description: Bad Request
        '401':
          description: Invalid Google access token
        '404':
          description: Account not found (mode=login)
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:post-auth-google/invocations
  /data/auth/reset-password:
    post:
      summary: Invoke post-auth-reset-password
      operationId: post_auth_reset_password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - newPassword
              properties:
                email:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: User not found
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: arn:aws:apigateway:ap-northeast-1:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:YOUR_AWS_ACCOUNT_ID:function:post-auth-reset-password/invocations
