openapi: 3.0.3
info:
  title: My API
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Swagger Mock API
paths:
  /data:
    get:
      summary: Get all data
      description: Returns all mock data defined in /src/data directory.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                MEMO_DATA:
                  $ref: '#/components/examples/MEMO_DATA'
                PROFILE_DATA:
                  $ref: '#/components/examples/PROFILE_DATA'
                PROJECT_DATA:
                  $ref: '#/components/examples/PROJECT_DATA'
                RECORD_DATA:
                  $ref: '#/components/examples/RECORD_DATA'
                TRACK_DATA:
                  $ref: '#/components/examples/TRACK_DATA'
                AUTH_DATA:
                  $ref: '#/components/examples/AUTH_DATA'
  /data/project:
    get:
      summary: Get project data
      description: Returns mock data for PROJECT_DATA.
      operationId: getPROJECT
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_DATA:
                  $ref: '#/components/examples/PROJECT_DATA'
    post:
      summary: Create a new project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectName
              properties:
                projectName:
                  type: string
                trackName:
                  type: string
                trackId:
                  type: string
                artworkKey:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  projectName:
                    type: string
                  updatedAt:
                    type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/project/{id}:
    get:
      summary: Get project detail
      description: Returns a single project by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_DATA_DETAIL:
                  $ref: '#/components/examples/PROJECT_DATA_DETAIL'
    put:
      summary: Update project
      description: Updates body (lyrics) and cueButtons for a project.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectName:
                  type: string
                body:
                  type: string
                cueButtons:
                  type: array
                  items:
                    type: object
                artworkKey:
                  type: string
                trackId:
                  type: string
                trackName:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      summary: Delete project
      description: Deletes a project and its associated S3 assets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /data/project/{id}/records:
    get:
      summary: Get record list for a specific project
      description: Returns record list data associated with a specific project.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_RECORD_LIST_DATA:
                  $ref: '#/components/examples/PROJECT_RECORD_LIST_DATA'
  /data/profile:
    get:
      summary: Get profile data
      description: Returns mock data for PROFILE_DATA.
      operationId: getPROFILE
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROFILE_DATA:
                  $ref: '#/components/examples/PROFILE_DATA'
    put:
      summary: Update profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                thumbnailKey:
                  type: string
                socialAccounts:
                  type: array
                  items:
                    type: object
                    properties:
                      provider:
                        type: string
                      username:
                        type: string
                      isLinked:
                        type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  email:
                    type: string
                  thumbnail:
                    type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/memo:
    get:
      summary: Get memo data
      description: Returns mock data for MEMO_DATA.
      operationId: getMEMO
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                MEMO_DATA:
                  $ref: '#/components/examples/MEMO_DATA'
    post:
      summary: Create a new memo
      operationId: createMemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                body:
                  type: string
                isBookmarked:
                  type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  body:
                    type: string
                  updatedAt:
                    type: string
                  isBookmarked:
                    type: boolean
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/memo/{id}:
    put:
      summary: Update a memo
      operationId: updateMemo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                body:
                  type: string
                isBookmarked:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  body:
                    type: string
                  updatedAt:
                    type: string
                  isBookmarked:
                    type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      summary: Delete a memo
      operationId: deleteMemo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /data/track/upload-url:
    get:
      summary: Get presigned S3 upload URL for a track file
      operationId: getTrackUploadUrl
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
        - name: contentType
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  key:
                    type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/track:
    get:
      summary: Get track data
      description: Returns mock data for TRACK_DATA.
      operationId: getTRACK
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                TRACK_DATA:
                  $ref: '#/components/examples/TRACK_DATA'
    post:
      summary: Create a new track
      operationId: createTrack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - s3Key
                - extention
              properties:
                title:
                  type: string
                s3Key:
                  type: string
                extention:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  s3Key:
                    type: string
                  extention:
                    type: string
                  linkedProjects:
                    type: array
                    items:
                      type: string
                  updatedAt:
                    type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/track/{id}:
    put:
      summary: Update a track title
      operationId: updateTrack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  updatedAt:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      summary: Delete a track
      operationId: deleteTrack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /data/record/upload-url:
    get:
      summary: Get presigned S3 upload URL for a record file
      operationId: getRecordUploadUrl
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
        - name: contentType
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  key:
                    type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/record:
    get:
      summary: Get record data
      description: Returns mock data for RECORD_DATA.
      operationId: getRECORD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    source:
                      type: string
                    projectId:
                      type: string
                    startPositionMs:
                      type: number
                    updatedAt:
                      type: string
                    isBookmarked:
                      type: boolean
                    recordedWithHeadphones:
                      type: string
                      enum: [wired, bluetooth, none]
                    separationStatus:
                      type: string
                      enum: [none, processing, done, failed]
                    separationType:
                      type: string
                      enum: [separate, denoise]
                    separatedSource:
                      type: string
              examples:
                RECORD_DATA:
                  $ref: '#/components/examples/RECORD_DATA'
    post:
      summary: Create a new record
      operationId: createRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - s3Key
              properties:
                title:
                  type: string
                s3Key:
                  type: string
                projectId:
                  type: string
                startPositionMs:
                  type: number
                isBookmarked:
                  type: boolean
                recordedWithHeadphones:
                  type: string
                  enum: [wired, bluetooth, none]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  source:
                    type: string
                  projectId:
                    type: string
                  startPositionMs:
                    type: number
                  updatedAt:
                    type: string
                  isBookmarked:
                    type: boolean
                  recordedWithHeadphones:
                    type: string
                    enum: [wired, bluetooth, none]
                  separationStatus:
                    type: string
                    enum: [none, processing, done, failed]
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/record/{id}/separate:
    post:
      summary: Start AI cleanup (vocal separation / denoise) for a record
      description: >
        Starts an AI cleanup job for the recorded audio.
        The processing type (separate / denoise) is chosen automatically from
        the headphone connection state at recording time. If the record has
        already been processed, the cached result is returned without starting
        a new job.
      operationId: separateRecord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  separationStatus:
                    type: string
                    enum: [none, processing, done, failed]
                  separationType:
                    type: string
                    enum: [separate, denoise]
                  separatedSource:
                    type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '502':
          description: Bad Gateway (failed to start the AI cleanup job)
        '503':
          description: Service Unavailable (AI cleanup is not configured)
  /data/record/{id}/separate-status:
    get:
      summary: Get AI cleanup status for a record
      description: >
        Polls the AI cleanup job status. When the job has finished, the
        processed audio is stored in S3 and a presigned URL is returned.
      operationId: getRecordSeparateStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  separationStatus:
                    type: string
                    enum: [none, processing, done, failed]
                  separationType:
                    type: string
                    enum: [separate, denoise]
                  separatedSource:
                    type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '503':
          description: Service Unavailable (AI cleanup is not configured)
  /data/record/{id}:
    put:
      summary: Update a record
      operationId: updateRecord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                isBookmarked:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  source:
                    type: string
                  updatedAt:
                    type: string
                  isBookmarked:
                    type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      summary: Delete a record
      operationId: deleteRecord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /data/auth/login:
    post:
      summary: Mock login authentication
      description: Returns user authentication mock data (email & password).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: testuser@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                AUTH_DATA:
                  $ref: '#/components/examples/AUTH_DATA'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Invalid credentials
  /data/auth/logout:
    post:
      summary: Mock logout
      description: Returns a success message for logout.
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                message: Logged out successfully
  /data/auth/refresh:
    post:
      summary: Refresh access token
      description: Issues a new token pair from a valid refresh token.
      operationId: postDataAuthRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock_refresh_token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      expiresIn:
                        type: integer
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /data/auth/register:
    post:
      summary: Register a new user
      operationId: postDataAuthRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: New User
                email:
                  type: string
                  example: newuser@example.com
                password:
                  type: string
                  example: password123
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                  thumbnail:
                    type: string
                    nullable: true
                  socialAccounts:
                    type: array
                    items:
                      type: object
                  token:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      expiresIn:
                        type: integer
        '400':
          description: Bad Request
        '409':
          description: Email already in use
  /data/auth/reset-password:
    post:
      summary: Reset user password
      operationId: postDataAuthResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - newPassword
              properties:
                email:
                  type: string
                  example: demo@example.com
                newPassword:
                  type: string
                  example: newpassword123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Bad Request
        '404':
          description: User not found
