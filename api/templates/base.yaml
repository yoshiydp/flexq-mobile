openapi: 3.0.3
info:
  title: FlexQ API (AWS)
  version: 1.0.0
  description: |
    This API serves mock data for FlexQ application.
    It is designed to be used with AWS API Gateway + Lambda.

servers:
  - url: https://{api_id}.execute-api.{region}.amazonaws.com/{stage}
    description: AWS API Gateway endpoint
    variables:
      api_id:
        default: your-api-id # API Gateway 作成後に置き換える
      region:
        default: ap-northeast-1
      stage:
        default: dev # dev / staging / prod

paths: {} # ← generate-openapi.ts が自動で埋め込む

components:
  examples: {} # ← generate-openapi.ts が自動生成
  schemas: {} # ← 必要ならここにschemaも追加可能（後で拡張しやすい）

# -------------------------------------------------
# AWS API GATEWAY SETTINGS
# -------------------------------------------------

x-amazon-apigateway-minimum-compression-size: 0

x-amazon-apigateway-gateway-responses:
  DEFAULT_4XX:
    statusCode: 400
    responseTemplates:
      application/json: '{"message":$context.error.messageString}'
  DEFAULT_5XX:
    statusCode: 500
    responseTemplates:
      application/json: '{"message":$context.error.messageString}'
# Optional: IAM / Cognito Authを追加したくなったら
# (後で generate-openapi.ts に組み込める設計)
