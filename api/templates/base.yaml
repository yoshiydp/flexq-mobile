openapi: 3.0.3
info:
  title: My API
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local Swagger Mock API

paths:
  /data:
    get:
      summary: Get all data
      description: Returns all mock data defined in /src/data directory.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                MEMO_DATA:
                  $ref: '#/components/examples/MEMO_DATA'
                PROFILE_DATA:
                  $ref: '#/components/examples/PROFILE_DATA'
                PROJECT_DATA:
                  $ref: '#/components/examples/PROJECT_DATA'
                RECORD_DATA:
                  $ref: '#/components/examples/RECORD_DATA'
                TRACK_DATA:
                  $ref: '#/components/examples/TRACK_DATA'

  /data/project:
    get:
      summary: Get project list
      description: Returns mock data for PROJECT_DATA.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_DATA:
                  $ref: '#/components/examples/PROJECT_DATA'

  /data/project/{id}:
    get:
      summary: Get project detail
      description: Returns a single project by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_DATA_DETAIL:
                  $ref: '#/components/examples/PROJECT_DATA_DETAIL'

  /data/project/{id}/records:
    get:
      summary: Get record list for a specific project
      description: Returns record list data associated with a specific project.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROJECT_RECORD_LIST_DATA:
                  $ref: '#/components/examples/PROJECT_RECORD_LIST_DATA'

  /data/profile:
    get:
      summary: Get profile
      description: Returns mock data for PROFILE_DATA.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                PROFILE_DATA:
                  $ref: '#/components/examples/PROFILE_DATA'

  /data/memo:
    get:
      summary: Get memo list
      description: Returns mock data for MEMO_DATA.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                MEMO_DATA:
                  $ref: '#/components/examples/MEMO_DATA'

  /data/track:
    get:
      summary: Get track list
      description: Returns mock data for TRACK_DATA.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                TRACK_DATA:
                  $ref: '#/components/examples/TRACK_DATA'

  /data/record:
    get:
      summary: Get record list
      description: Returns mock data for RECORD_DATA.
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                RECORD_DATA:
                  $ref: '#/components/examples/RECORD_DATA'

components:
  examples:
    MEMO_DATA:
      value:
        - id: '1'
          title: 'Quick Notes'
          body: '<p>This is a memo example.</p>'
          updatedAt: '2023-10-01T12:00:00Z'
          isBookmarked: false
        - id: '2'
          title: 'Second Memo'
          body: '<ul><li>Item 1</li><li>Item 2</li></ul>'
          updatedAt: '2023-10-02T15:30:00Z'
          isBookmarked: true

    PROFILE_DATA:
      value:
        id: 'user_01'
        username: 'Yoshi Watanabe'
        email: 'contact@example.com'
        thumbnail: 'http://localhost:3000/images/sample/profile-thumb.jpg'
        socialAccounts:
          - provider: 'Twitter'
            username: '@user_name'
            isLinked: true
          - provider: 'Instagram'
            username: '@insta_user'
