# Maestro ワークスペース設定
#
# 実行例:
#   maestro test .maestro                     # 全フロー
#   maestro test .maestro --include-tags=PE   # セクション単位（tags で絞り込み）
#   maestro test .maestro/flows/02-sign-in/SI-04-login.yaml  # 単一フロー
#
# 構成: flows/<セクション番号-slug>/<ケースID>-<slug>.yaml
#   - docs/test-cases.md のセクション・ケース ID と対応させる
#   - 各フローの tags にセクション ID（例: PE）とケース ID（例: PE-11）を付与する
# flows/helpers/ は共通ヘルパー（glob 対象外。各フローから runFlow で呼び出す）
flows:
  - "flows/[0-9]*/*.yaml"
