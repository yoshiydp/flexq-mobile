# Maestro ワークスペース設定
#
# 実行例:
#   maestro test .maestro                     # 全フロー
#   maestro test .maestro --include-tags=PE   # セクション単位（tags で絞り込み）
#   maestro test .maestro/flows/02-sign-in/SI-04-login.yaml  # 単一フロー
#
# 構成: flows/<セクション番号-slug>/<ケースID>-<slug>.yaml
#   - docs/test-cases.md のセクション・ケース ID と対応させる
#   - 各フローの tags にセクション ID（例: PE）とケース ID（例: PE-11）を付与する
# flows/helpers/ は共通ヘルパー（glob 対象外。各フローから runFlow で呼び出す）
#
# tags: mock — モック API サーバー（yarn mock:server + .env.local で localhost:3000）
#   接続を前提とするフロー（TASK-85 の認証コード関連）。dev 接続の通常実行では
#   失敗するため既定で除外する。実行する場合はファイル / セクションディレクトリを
#   直接指定する（ワークスペース指定だと下の excludeTags が --include-tags より
#   優先され 0 件になる）:
#     maestro test .maestro/flows/03-register/RG-07-invalid-verification-code.yaml
flows:
  - "flows/[0-9]*/*.yaml"
excludeTags:
  - mock
