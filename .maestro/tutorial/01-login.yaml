# チュートリアル動画（TASK-139）撮影の前準備: 撮影専用アカウントでログインし、
# 空の PROJECT LIST を表示した状態で止める（この間は録画しない）。
#
# 実行: maestro test .maestro/tutorial/01-login.yaml
# 続けて録画を開始してから 02-new-project.yaml を実行する（record.sh がまとめて行う）

appId: com.yoshiydp.lyricsapp
env:
  API_BASE_URL: 'https://e02397anue.execute-api.ap-northeast-1.amazonaws.com/v1'
  TUTORIAL_EMAIL: 'yoshihisa.watanabe.info+tutorial@gmail.com'
  TUTORIAL_PASSWORD: 'password123'
---
- runScript: ../scripts/tutorial-account-reset.js
- runFlow:
    file: ../flows/helpers/login-as.yaml
    env:
      LOGIN_EMAIL: ${TUTORIAL_EMAIL}
      LOGIN_PASSWORD: ${TUTORIAL_PASSWORD}
# プロジェクト 0 件のため初回チュートリアルが出る。撮影するのは一覧からの操作なので閉じる
- extendedWaitUntil:
    visible:
      id: 'tutorial-modal'
    timeout: 20000
- tapOn:
    id: 'tutorial-skip-button'
- waitForAnimationToEnd:
    timeout: 3000
# iCloud サインイン済みのシミュレーターでは「Apple Account の確認」が遅れて出ることがあり、
# 録画に映り込むため、撮影前に出ていれば閉じる
- tapOn:
    text: '今はしない'
    optional: true
# 空状態（プロジェクト 0 件）で止まっていること
- extendedWaitUntil:
    visible: 'プロジェクトがありません'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
