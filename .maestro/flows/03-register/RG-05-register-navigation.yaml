# ID: RG-05
# シナリオ名: 新規登録画面への遷移・戻る確認
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: 新規登録へ リンクをタップ → 登録画面を確認 → 戻る
# 期待結果: 登録画面が表示され、各入力フィールドと CREATE ボタンが確認でき、戻るボタンでサインイン画面に戻る
# 備考: SI-06（画面の行き来）の「新規登録へ」側も兼ねる
# ※ 実際の登録処理は行わない（テスト用DBへの不要データ作成を防ぐため。登録成功は手動確認: docs/test-cases.md RG-03）

appId: com.yoshiydp.lyricsapp
tags:
  - RG
  - RG-05
---
# 起動（共通ヘルパー。アプリ状態を初期化しログイン画面表示まで待機）
- runFlow: ../helpers/launch-app.yaml

# 新規登録画面へ遷移
- tapOn: '新規登録へ'
- waitForAnimationToEnd:
    timeout: 5000

# 新規登録画面のアサーション
- assertVisible: 'REGISTER'
- assertVisible: 'User Name'
- assertVisible: 'Email'
- assertVisible: 'Password'
- assertVisible: 'CREATE'

# ログイン画面に戻る
- tapOn:
    id: 'toolbar-back'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Your Email'
