# ID: TRACK-01
# シナリオ名: トラックリスト表示
# 前提条件: ログアウト済み・ログイン画面が表示されている
# 操作手順: ログイン → TRACK LIST タブをタップ
# 期待結果: TRACK LIST タイトルとトラック一覧が表示される

appId: com.yoshiydp.lyricsapp
---
# ログイン
- runFlow: ./helpers/login.yaml

# トラックリスト画面へ遷移
- tapOn:
    id: 'nav-TrackList'
- waitForAnimationToEnd:
    timeout: 5000

# トラックリスト画面のアサーション
- assertVisible: 'TRACK'
- assertVisible: 'LIST'
