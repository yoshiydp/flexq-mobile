# iOS のパスワード保存プロンプト（iCloud キーチェーン）を閉じる共通ヘルパー
# パスワード欄を含むフォームを送信すると OS が「パスワードを保存しますか？」を
# 出すことがあり、以降のタップ・アサートがモーダルに阻まれて失敗する。
# 表示されていないときは何もしない（when: visible の分岐のため安全に呼べる）。
# 使い方: パスワードを入力・送信した直後に
#   `- runFlow: ../helpers/dismiss-password-save.yaml`
# ※ Android には同等のプロンプトがないため iOS のみ対象
# ※ シミュレーターの言語設定で英語表記（Not Now）になる場合も拾えるようにしている

appId: com.yoshiydp.lyricsapp
---
# プロンプトは送信直後ではなく画面遷移の後に遅れて出ることがあるため、
# 判定前に少し待つ（出ていなければ空振りで即座に次へ進む）
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 1500
- runFlow:
    when:
      platform: iOS
      visible: '(今はしない|Not Now)'
    commands:
      - tapOn: '(今はしない|Not Now)'
      - waitForAnimationToEnd:
          timeout: 3000
