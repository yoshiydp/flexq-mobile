# ID: PROJ-02
# シナリオ名: 新規プロジェクト作成画面への遷移確認
# 前提条件: ログアウト済み・ログイン画面が表示されている
# 操作手順: ログイン → New Project ボタンをタップ → 画面確認 → 戻る
# 期待結果: NEW PROJECT 画面が表示され、各入力項目が確認できる
# ※ 実際の作成処理は行わない（テスト用DBへの不要データ作成を防ぐため）

appId: com.yoshiydp.lyricsapp
---
- launchApp
# ログイン
- assertVisible: 'Your Email'
- tapOn: 'メールアドレスを入力してください'
- inputText: 'demo@example.com'
- tapOn: 'パスワードを入力してください'
- inputText: 'password123'
- pressKey: Enter
- tapOn: 'SIGN IN'
- waitForAnimationToEnd:
    timeout: 10000

# New Project ボタンをタップ
- tapOn:
    id: 'header-action-button'
- waitForAnimationToEnd:
    timeout: 5000

# 新規プロジェクト作成画面のアサーション
- assertVisible: 'NEW PROJECT'
- assertVisible: 'PROJECT TITLE'
- assertVisible: 'AUDIO SOURCE'
- assertVisible: 'ARTWORK'
- assertVisible: 'CREATE'

# プロジェクトリストに戻る
- tapOn:
    id: 'toolbar-back'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'PROJECT'
