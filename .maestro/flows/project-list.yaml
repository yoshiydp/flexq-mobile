# ID: PROJ-01
# シナリオ名: プロジェクトリスト表示
# 前提条件: ログアウト済み・ログイン画面が表示されている
# 操作手順: ログイン
# 期待結果: PROJECT LIST タイトルとプロジェクト一覧が表示される

appId: com.yoshiydp.lyricsapp
---
- launchApp
# ログイン
- assertVisible: 'Your Email'
- tapOn: 'メールアドレスを入力してください'
- inputText: 'demo@example.com'
- tapOn: 'パスワードを入力してください'
- inputText: 'password123'
- pressKey: Enter
- tapOn: 'SIGN IN'
- waitForAnimationToEnd:
    timeout: 10000

# プロジェクトリスト画面のアサーション
- assertVisible: 'PROJECT'
- assertVisible: 'LIST'
- assertVisible: 'New'
