# ID: SI-12
# シナリオ名: 不正な Apple トークンの拒否（API 入力検証）
# 前提条件: dev API に TASK-132 の Lambda（POST /data/auth/apple）がデプロイ済みであること
#           （UI 操作は伴わず、runScript で API を直接検証する）
# 操作手順: POST /data/auth/apple に ① 空のボディ ② nonce なし ③ JWT 形式でない文字列
#           ④ Apple の kid を名乗る偽署名の JWT ⑤ 存在しない kid の JWT を送る
# 期待結果: ①② は 400、③④⑤ は 401 で拒否され、トークンは発行されない
# 備考: TASK-132。本物の Apple の署名付きトークンはテストから作れないため、
#       成功系（SI-07〜SI-09 / RG-10）と退会時の失効（PF-04）は手動確認

appId: com.yoshiydp.lyricsapp
tags:
  - SI
  - SI-12
env:
  API_BASE_URL: 'https://e02397anue.execute-api.ap-northeast-1.amazonaws.com/v1'
