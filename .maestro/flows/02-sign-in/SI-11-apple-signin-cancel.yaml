# ID: SI-11
# シナリオ名: Apple でサインインのキャンセル（iOS のみ）
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: 「Apple でサインイン」をタップ → 表示された Apple の画面を閉じる
#           （端末が Apple ID にサインイン済みならサインインのシートの「閉じる」、
#             未サインインなら「Apple Account にサインインしてください」のダイアログの「閉じる」）
# 期待結果: エラーのアラートは出ず、サインイン画面のまま（その後もメール/パスワードでログインできる）
# 備考: TASK-132。Apple のシートは別プロセスの UI だが、要素の座標は画面基準で返るため
#       iOS の共有シート（CLAUDE.md の E2E 注意事項）と違って「閉じる」を tapOn できる。
#       シートの先（パスワード入力・サインインの成功）は本物の Apple ID が必要なため
#       SI-07〜SI-09 の手動確認とする。Android ではボタン自体が無いため何もしない

appId: com.yoshiydp.lyricsapp
tags:
  - SI
  - SI-11
---
- runFlow: ../helpers/launch-app.yaml

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'apple-signin-button'
      # Apple の画面が出るまで待つ（サインイン済みはシート、未サインインは
      # 「Apple Account にサインインしてください」のダイアログ）。
      # 「Apple Account」の間はノーブレークスペース（U+00A0）のため "." で受ける
      - extendedWaitUntil:
          visible: '(Apple.?でサインイン|Sign [Ii]n [Ww]ith Apple|.*Apple.Account.*|.*Apple.ID.*)'
          timeout: 15000
      # シートが下から出てくる途中の座標で押すと別のボタンに当たるため、表示しきってから押す
      - waitForAnimationToEnd:
          timeout: 5000
      # シートの × もダイアログの左のボタンも「閉じる」（英語環境は Close / Cancel）
      - tapOn: '(閉じる|Close|キャンセル|Cancel)'
      - waitForAnimationToEnd:
          timeout: 5000
      # シートが閉じ、エラーのアラートを出さずにサインイン画面へ戻る
      - extendedWaitUntil:
          notVisible:
            id: 'Sign In With Apple'
          timeout: 10000
      - assertNotVisible: 'エラー'
      - assertNotVisible: 'ログインに失敗しました'
      - assertVisible: 'Your Email'
      - assertVisible:
          id: 'apple-signin-button'
