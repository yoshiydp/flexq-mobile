# ID: PROF-03
# シナリオ名: ユーザー名編集・保存
# 前提条件: ログアウト済み・ログイン画面が表示されている
# 操作手順: ログイン → PROFILE → 編集ボタン → ユーザー名変更 → SAVE
# 期待結果: 変更後のユーザー名がプロフィール画面に反映される

appId: com.yoshiydp.lyricsapp
---
- launchApp
# ログイン
- assertVisible: 'Your Email'
- tapOn: 'メールアドレスを入力してください'
- inputText: 'demo@example.com'
- tapOn: 'パスワードを入力してください'
- inputText: 'password123'
- pressKey: Enter
- tapOn: 'SIGN IN'
- waitForAnimationToEnd:
    timeout: 10000

# プロフィール画面へ遷移
- tapOn:
    id: 'nav-Profile'
- waitForAnimationToEnd:
    timeout: 5000

# プロフィール編集画面を開く
- tapOn:
    id: 'header-action-button'
- waitForAnimationToEnd:
    timeout: 5000

# ユーザー名を変更
- tapOn: 'ユーザー名を入力してください'
- eraseText: 50
- inputText: 'Demo User Updated'
- pressKey: Enter

# 保存
- tapOn: 'SAVE'
# API保存 + navigation.goBack() の完了を LOGOUT の表示で判断する
- extendedWaitUntil:
    visible: 'LOGOUT'
    timeout: 15000

# プロフィール画面に戻り変更が反映されたことを確認
- assertVisible: 'PROFILE'
- assertVisible: 'User Name'
- assertVisible: 'Demo User Updated'
- assertVisible: 'LOGOUT'
