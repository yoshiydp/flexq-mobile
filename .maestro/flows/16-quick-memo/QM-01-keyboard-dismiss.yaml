# ID: QM-01
# シナリオ名: QUICK MEMO - タイトル入力中にボディエリアタップでキーボードが閉じ改行が挿入されない
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: ログイン → DRAFTS → QUICK MEMO → タイトル入力 → ボディエリアタップ
# 期待結果: キーボードが閉じる。ボディエリアに改行が挿入されない（SAVEボタンが非活性のまま）
# 備考: TASK-13 のリグレッションテスト。ボディが空のままなら SAVE が非活性（QM-01: 保存ボタンの条件）であることを代替指標とする

appId: com.yoshiydp.lyricsapp
tags:
  - QM
  - QM-01
---
# ログイン（共通ヘルパー。iOS / Android 対応）
- runFlow: ../helpers/login.yaml

# DRAFTS 画面へ遷移
- tapOn:
    id: 'nav-Drafts'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'DRAFTS'

# QUICK MEMO を開く
- tapOn:
    id: 'drafts-quick-memo-button'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'QUICK MEMO'

# タイトル入力フィールドをタップ（キーボードを開く）
# ※ Android の Maestro は非 ASCII 文字の inputText をサポートしないため ASCII で入力する
- tapOn: 'タイトルを入力してください'
- inputText: 'Keyboard Test'

# ボディエリア（テキストエリア）をタップしてキーボードを閉じる
# BodyInput (tentap の WebView) はプレースホルダーに直接アクセスできないため座標でタップする
# 50%, 50% は iOS / Android どちらもソフトキーボードに隠れない画面中央（ボディエリア内）
- tapOn:
    point: '50%, 50%'
- waitForAnimationToEnd:
    timeout: 1000

# タイトルに入力したテキストが残っていることを確認
- assertVisible: 'Keyboard Test'

# ボディに改行が挿入されていないことを確認
# （タイトルあり・ボディ空なら SAVE は非活性のまま。改行が挿入されると isBodyEmpty=false になり活性化してしまう）
# ※ キーボードが閉じたこと自体は Maestro では直接アサートできないため（キーボード状態のセレクタなし・
#   キーボード表示に連動する要素に testID がない）、TASK-13 の実バグである「改行挿入」の有無を代替指標とする
- assertVisible:
    id: 'submit-button'
    enabled: false
- assertVisible: 'QUICK MEMO'

# 戻る（変更破棄）
- tapOn:
    id: 'toolbar-back'
- waitForAnimationToEnd:
    timeout: 3000
