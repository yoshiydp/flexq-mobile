# ID: PE-01
# シナリオ名: プロジェクト編集・保存（戻るボタン経由）
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）・dev 環境の demo アカウントに 1 件以上のプロジェクトが存在する
# 操作手順: ログイン → プロジェクトをタップ → 戻るボタンをタップ → 保存確認モーダルで SAVE
# 期待結果: APIリクエストが実行されプロジェクトリストに戻る
# 備考: タイトル変更を伴う保存反映の確認は手動（docs/test-cases.md PE-01）。本フローは戻る → 保存確認 → SAVE の API 保存動線を確認する

appId: com.yoshiydp.lyricsapp
tags:
  - PE
  - PE-01
---
# ログイン
- runFlow: ../helpers/login.yaml

# 先頭のプロジェクトをタップ
- tapOn:
    id: 'project-item-0'
- waitForAnimationToEnd:
    timeout: 5000

# プロジェクト編集画面のアサーション（プロジェクト名は dev 環境のデータに依存するため固定 UI の id で確認する）
- assertVisible:
    id: 'toolbar-hamburger'

# 戻るボタンをタップして保存確認モーダルを表示
- tapOn:
    id: 'toolbar-back'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: '編集中のプロジェクトを保存してプロジェクトリストに戻りますか？'

# SAVEをタップしてAPIリクエストを実行
- tapOn: 'SAVE'
# API保存 + navigation.goBack() の完了をプロジェクトリストの表示で判断
- extendedWaitUntil:
    visible: 'PROJECT'
    timeout: 15000

# プロジェクトリストに戻ったことを確認
- assertVisible: 'PROJECT'
