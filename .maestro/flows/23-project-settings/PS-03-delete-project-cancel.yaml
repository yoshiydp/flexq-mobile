# ID: PS-03
# シナリオ名: プロジェクト削除（キャンセル確認）→ 設定画面を閉じる
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）・dev 環境の demo アカウントに 1 件以上のプロジェクトが存在する
# 操作手順: ログイン → プロジェクトをタップ → 設定(ハンバーガー)をタップ → DELETE PROJECT をタップ → キャンセル → 設定画面を閉じる
# 期待結果: 削除確認モーダルが表示され、キャンセル後に設定画面に戻り、閉じるとプロジェクト編集画面に戻る
# 備考: 実際の削除処理は行わない（テストデータ保護のため。実削除は手動確認: docs/test-cases.md PS-03）

appId: com.yoshiydp.lyricsapp
tags:
  - PS
  - PS-03
---
# ログイン
- runFlow: ../helpers/login.yaml

# プロジェクト詳細画面へ遷移
- tapOn:
    id: 'project-item-0'
- waitForAnimationToEnd:
    timeout: 5000

# 設定画面を開く（ハンバーガーボタン）
- tapOn:
    id: 'toolbar-hamburger'
- waitForAnimationToEnd:
    timeout: 5000

# 削除ボタンをタップして確認モーダルを表示
- tapOn: 'DELETE PROJECT'
- assertVisible: 'このプロジェクトを削除してもいいですか？'

# CANCEL でモーダルを閉じる
- tapOn: 'CANCEL'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: 'DELETE PROJECT'

# 設定画面（ProjectSettingsScreen）を閉じてプロジェクト編集画面に戻る
# （プロジェクト名は dev 環境のデータに依存するため固定 UI の id で確認する）
- tapOn:
    id: 'close-button'
- assertVisible:
    id: 'toolbar-hamburger'
