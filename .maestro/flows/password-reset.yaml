# ID: AUTH-04
# シナリオ名: パスワードリセット画面への遷移確認
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: パスワードをリセットする リンクをタップ → リセット画面（メール入力ステップ）を確認 → 戻る
# 期待結果: リセット画面が表示され、メール入力フィールドと SEND CODE ボタンが確認できる
# ※ 実際のコード送信・リセット処理は行わない（テスト用DBへの変更とメール送信を防ぐため）
# ※ TASK-85 で 2 ステップ化（① Email + SEND CODE → ② 認証コード + New Password）。
#    コード入力ステップはメール受信が必要なため E2E では検証しない

appId: com.yoshiydp.lyricsapp
---
# 起動（共通ヘルパー。アプリ状態を初期化しログイン画面表示まで待機）
- runFlow: ./helpers/launch-app.yaml

# パスワードリセット画面へ遷移
- tapOn: 'パスワードをリセットする'
- waitForAnimationToEnd:
    timeout: 5000

# パスワードリセット画面（メール入力ステップ）のアサーション
- assertVisible: 'PASSWORD RESET'
- assertVisible: 'Email'
- assertVisible: 'SEND CODE'

# ログイン画面に戻る
- tapOn:
    id: 'toolbar-back'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Your Email'
