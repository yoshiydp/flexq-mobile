# ID: AUTH-04
# シナリオ名: パスワードリセット画面への遷移確認
# 前提条件: ログアウト済み・ログイン画面が表示されている
# 操作手順: パスワードをリセットする リンクをタップ → リセット画面を確認 → 戻る
# 期待結果: リセット画面が表示され、各入力フィールドと PASSWORD RESET ボタンが確認できる
# ※ 実際のリセット処理は行わない（テスト用DBへの変更を防ぐため）

appId: com.yoshiydp.lyricsapp
---
- launchApp
- assertVisible: 'Your Email'

# パスワードリセット画面へ遷移
- tapOn: 'パスワードをリセットする'
- waitForAnimationToEnd:
    timeout: 5000

# パスワードリセット画面のアサーション
- assertVisible: 'PASSWORD RESET'
- assertVisible: 'Email'
- assertVisible: 'New Password'
- assertVisible: 'PASSWORD RESET'

# ログイン画面に戻る
- tapOn:
    id: 'toolbar-back'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Your Email'
