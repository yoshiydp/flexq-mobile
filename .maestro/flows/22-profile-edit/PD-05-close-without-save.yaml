# ID: PD-05
# シナリオ名: プロフィール編集画面表示・保存せずに閉じる
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: ログイン → PROFILE → 編集ボタンをタップ → 閉じるボタンをタップ
# 期待結果: 編集画面が開き、閉じるとプロフィール画面に戻る
# 備考: 名前を変更してから閉じた場合に反映されないことの確認は手動（docs/test-cases.md PD-05）。本フローは変更なしで閉じる動線のみ確認する

appId: com.yoshiydp.lyricsapp
tags:
  - PD
  - PD-05
---
# ログイン
- runFlow: ../helpers/login.yaml

# プロフィール画面へ遷移
- tapOn:
    id: 'nav-Profile'
- waitForAnimationToEnd:
    timeout: 5000

# プロフィール編集画面を開く
- tapOn:
    id: 'header-action-button'
- waitForAnimationToEnd:
    timeout: 5000

# プロフィール編集画面のアサーション
- assertVisible: 'User Name'
- assertVisible: 'Email'
- assertVisible: 'SAVE'

# 閉じてプロフィール画面に戻る
- tapOn:
    id: 'close-button'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'LOGOUT'
