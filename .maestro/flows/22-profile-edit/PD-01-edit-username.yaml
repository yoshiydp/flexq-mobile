# ID: PD-01
# シナリオ名: ユーザー名の変更・保存
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: ログイン → PROFILE → 編集ボタン → ユーザー名変更 → SAVE
# 期待結果: 変更後のユーザー名がプロフィール画面に反映される

appId: com.yoshiydp.lyricsapp
tags:
  - PD
  - PD-01
---
# ログイン
- runFlow: ../helpers/login.yaml

# プロフィール画面へ遷移
- tapOn:
    id: 'nav-Profile'
- waitForAnimationToEnd:
    timeout: 5000

# プロフィール編集画面を開く
- tapOn:
    id: 'header-action-button'
- waitForAnimationToEnd:
    timeout: 5000

# ユーザー名を変更
- tapOn: 'ユーザー名を入力してください'
- eraseText: 50
- inputText: 'Demo User Updated'
- runFlow: ../helpers/hide-keyboard.yaml

# 保存
- tapOn: 'SAVE'
# API保存 + navigation.goBack() の完了を LOGOUT の表示で判断する
- extendedWaitUntil:
    visible: 'LOGOUT'
    timeout: 15000

# プロフィール画面に戻り変更が反映されたことを確認
- assertVisible: 'PROFILE'
- assertVisible: 'User Name'
- assertVisible: 'Demo User Updated'
- assertVisible: 'LOGOUT'
