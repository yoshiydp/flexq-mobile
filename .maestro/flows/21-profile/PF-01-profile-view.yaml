# ID: PF-01
# シナリオ名: プロフィール画面表示
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: ログイン → PROFILE タブをタップ
# 期待結果: ユーザー名・メールアドレス・LOGOUT が表示される

appId: com.yoshiydp.lyricsapp
tags:
  - PF
  - PF-01
---
# ログイン
- runFlow: ../helpers/login.yaml

# プロフィール画面へ遷移
- tapOn:
    id: 'nav-Profile'
- waitForAnimationToEnd:
    timeout: 5000

# プロフィール画面のアサーション
- assertVisible: 'PROFILE'
- assertVisible: 'User Name'
- assertVisible: 'Email'
- assertVisible: 'demo@example.com'
- assertVisible: 'LOGOUT'
