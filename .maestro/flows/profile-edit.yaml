# ID: PROF-02
# シナリオ名: プロフィール編集画面表示・閉じる
# 前提条件: ログアウト済み・ログイン画面が表示されている
# 操作手順: ログイン → PROFILE → 編集ボタンをタップ → 閉じるボタンをタップ
# 期待結果: 編集画面が開き、閉じるとプロフィール画面に戻る

appId: com.yoshiydp.lyricsapp
---
- launchApp
# ログイン
- assertVisible: 'Your Email'
- tapOn: 'メールアドレスを入力してください'
- inputText: 'demo@example.com'
- tapOn: 'パスワードを入力してください'
- inputText: 'password123'
- pressKey: Enter
- tapOn: 'SIGN IN'
- waitForAnimationToEnd:
    timeout: 10000

# プロフィール画面へ遷移
- tapOn:
    id: 'nav-Profile'
- waitForAnimationToEnd:
    timeout: 5000

# プロフィール編集画面を開く
- tapOn:
    id: 'header-action-button'
- waitForAnimationToEnd:
    timeout: 5000

# プロフィール編集画面のアサーション
- assertVisible: 'User Name'
- assertVisible: 'Email'
- assertVisible: 'SAVE'

# 閉じてプロフィール画面に戻る
- tapOn:
    id: 'close-button'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'LOGOUT'
