# ID: PL-04
# シナリオ名: 新規プロジェクト作成画面への遷移確認
# 前提条件: 起動時にアプリ状態を初期化しログイン画面から開始する（手動ログアウト不要）
# 操作手順: ログイン → New Project ボタンをタップ → 画面確認 → 戻る
# 期待結果: NEW PROJECT 画面が表示され、各入力項目が確認できる
# ※ 実際の作成処理は行わない（テスト用DBへの不要データ作成を防ぐため。作成成功は手動確認: docs/test-cases.md NP-05）

appId: com.yoshiydp.lyricsapp
tags:
  - PL
  - PL-04
---
# ログイン
- runFlow: ../helpers/login.yaml

# New Project ボタンをタップ
- tapOn:
    id: 'header-action-button'
- waitForAnimationToEnd:
    timeout: 5000

# 新規プロジェクト作成画面のアサーション
- assertVisible: 'NEW PROJECT'
- assertVisible: 'PROJECT TITLE'
- assertVisible: 'AUDIO SOURCE'
- assertVisible: 'ARTWORK'
- assertVisible: 'CREATE'

# プロジェクトリストに戻る
- tapOn:
    id: 'toolbar-back'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'PROJECT'
