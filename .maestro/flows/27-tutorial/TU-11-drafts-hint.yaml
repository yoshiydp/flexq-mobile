# ID: TU-11（TU-12 も兼ねる）
# シナリオ名: メモも録音も無いユーザーが DRAFTS を初めて開くと、クイックメモ / クイック録音のヒントが出る（TASK-140）
# 前提条件: dev API に接続できること・チュートリアル用アカウント（下の env）が存在すること
#           （フロー内の API セットアップでプロジェクト・メモ・録音を全件削除する）
# 操作手順: ログイン → 初回チュートリアルをスキップ → DRAFTS タブ → QUICK MEMO のページ（動画あり）を確認
#           → 次へ → QUICK RECORD のページを確認（最後のページは「閉じる」だけ）→ 閉じる
#           → PROJECT LIST に移ってから DRAFTS を開き直す
# 期待結果: ヒントが 2 ページで表示され、閉じると DRAFTS が見える。開き直してもヒントは出ない（TU-12）
# 備考: launch-app.yaml の clearState で完了フラグ（AsyncStorage）が消えるため、毎回初回として表示される

appId: com.yoshiydp.lyricsapp
tags:
  - TU
  - TU-11
  - TU-12
env:
  API_BASE_URL: 'https://e02397anue.execute-api.ap-northeast-1.amazonaws.com/v1'
  TUTORIAL_EMAIL: 'yoshihisa.watanabe.info+tutorial@gmail.com'
  TUTORIAL_PASSWORD: 'password123'
---
- runScript: ../../scripts/tutorial-account-reset.js
- runFlow:
    file: ../helpers/login-as.yaml
    env:
      LOGIN_EMAIL: ${TUTORIAL_EMAIL}
      LOGIN_PASSWORD: ${TUTORIAL_PASSWORD}
- extendedWaitUntil:
    visible:
      id: 'tutorial-title-welcome'
    timeout: 20000
- tapOn:
    id: 'tutorial-skip-button'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: '今はしない'
    optional: true

- tapOn:
    id: 'nav-Drafts'
- extendedWaitUntil:
    visible:
      id: 'tutorial-title-drafts-quick-memo'
    timeout: 20000
- assertVisible:
    id: 'tutorial-video'
- assertVisible:
    id: 'tutorial-skip-button'
- tapOn:
    id: 'tutorial-next-button'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: 'tutorial-title-drafts-quick-record'
# 最後のページは「閉じる」だけ（「あとで」は出さない）
- assertNotVisible:
    id: 'tutorial-skip-button'
- assertVisible: '閉じる'
- tapOn:
    id: 'tutorial-next-button'
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: 'tutorial-modal'
- assertVisible:
    id: 'drafts-quick-memo-button'

# 開き直しても出ない（TU-12）
- tapOn:
    id: 'nav-ProjectList'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'nav-Drafts'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: 'drafts-quick-memo-button'
- assertNotVisible:
    id: 'tutorial-modal'
